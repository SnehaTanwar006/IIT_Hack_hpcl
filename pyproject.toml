[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcl-lead-intelligence"
version = "0.2.0"
description = "Recruiter-ready B2B lead intelligence prototype for HPCL Direct Sales."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "python-dateutil>=2.8.2",
  "loguru>=0.7.2",
  "feedparser>=6.0.11",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "src", "backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "src*", "integration*"]
